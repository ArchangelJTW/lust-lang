[workspace]
members = [
  ".",
  "crates/lust-analyzer",
  "crates/lust-macros",
  "crates/lust-fuzz",
  "crates/lust-tokio",
  "crates/lust-telemetry-metrics",
  "crates/lust-telemetry-otel",
  "crates/lust-telemetry-prometheus",
  "crates/lust-telemetry-tracing",
  "crates/lust-napi",
  "crates/lust-aot-rt",
]
exclude = ["examples/rust-extension/extensions/**", "tree-sitter-lust", "tests/compile_fail/fs_gate"]

[package]
name = "lust-rs"
version = "3.5.8"
edition = "2024"
include = [
  "/src/**",
  "/include/**",
  "/examples/embed.rs",
  "/benchmarks/numeric.rs",
  "/build.rs",
  "/Cargo.toml",
  "/README.md",
  "/LICENSE",
  "/LICENSE-MIT",
  "/LICENSE-APACHE",
]
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = [
  "scripting",
  "scripting-language",
  "scripting-engine",
  "embedded",
  "lust",
]
categories = [
  "parser-implementations",
  "compilers",
  "development-tools",
  "wasm",
]
description = "A WIP Lua-like scripting language implemented in Rust, designed for embedding and rapid scripting with a strong type system, with trace-based JIT."
homepage = "https://lust-lang.dev/"
build = "build.rs"

[lib]
name = "lust"
crate-type = ["rlib", "cdylib"]

[features]
default = ["std", "packages", "bindgen", "net-services", "cli-mimalloc"]
cli-mimalloc = ["dep:mimalloc"]
bindgen = ["std"]
net-services = [
  "std",
  "dep:tokio",
  "dep:hyper",
  "dep:hyper-util",
  "dep:http-body-util",
  "dep:bytes",
  "dep:rusqlite",
]
test-deopt = ["std"]
std = [
  "dep:toml",
  "serde/std",
  "thiserror/std",
  "dep:lust-macros",
  "dep:regex",
  "dep:regex-automata",
  "dep:rand",
  "dep:cranelift-codegen",
  "dep:cranelift-frontend",
  "dep:cranelift-jit",
  "dep:cranelift-module",
  "dep:cranelift-native",
  "dep:serde_json",
  "dep:tempfile",
]
# JIT for riscv32 targets. Enables `std` because dynasmrt requires it
# (memmap2, std::sync). Requires a std-capable runtime (e.g. Linux/RISC-V).
# Floats require the RV32F extension.
rv32 = ["std", "dep:dynasmrt"]
legacy-dynasm = ["std", "dep:dynasmrt"]
libloading = ["std", "dep:libloading"]
dirs = ["std", "dep:dirs"]
packages = ["std", "libloading", "dirs", "dep:object"]
lua_transpile = ["std", "dep:full_moon"]
# ESP32 debugging support - adds logging
esp32c6-logging = ["dep:log"]
# JSONC optional CST support - off by default (WBS 12C-02)
jsonc_cst = []

# Telemetry features (Track 2C per RFC_TELEMETRY_AND_METRICS)
telemetry = []
telemetry-vm = ["telemetry"]
telemetry-jit = ["telemetry"]
telemetry-effects = ["telemetry"]
telemetry-user = ["telemetry"]
telemetry-all = ["telemetry-vm", "telemetry-jit", "telemetry-effects", "telemetry-user"]

# WASI features (Track 2G per RFC_WASM_WASI_SUPPORT)
wasi = ["std"]
wasi-p2 = ["wasi"]

[[bin]]
name = "lust"
path = "src/main.rs"
required-features = ["std"]

[[example]]
name = "numeric"
path = "benchmarks/numeric.rs"
required-features = ["std"]

[[bin]]
name = "effects_bench"
path = "benchmarks/effects_bench.rs"
required-features = ["std"]

[[bin]]
name = "test_framework_bench"
path = "benchmarks/test_framework_bench.rs"
required-features = ["std"]

[[bin]]
name = "tost_equivalence"
path = "benchmarks/tost_equivalence.rs"
required-features = ["std"]

[[example]]
name = "schema_validation"
path = "examples/schemas/01_schema_validation.rs"
required-features = ["std"]

[[example]]
name = "schema_json"
path = "examples/schemas/02_json_deserialization.rs"
required-features = ["std"]

[[example]]
name = "schema_msgpack"
path = "examples/schemas/03_messagepack_binary.rs"
required-features = ["std"]

[[example]]
name = "sim_scheduler"
path = "examples/simulation/01_deterministic_scheduler.rs"
required-features = ["std"]

[[example]]
name = "sim_fault_injection"
path = "examples/simulation/02_fault_injection_vfs.rs"
required-features = ["std"]

[[example]]
name = "sim_replay_bundle"
path = "examples/simulation/03_replay_bundle_export.rs"
required-features = ["std"]

[[example]]
name = "effects_basic"
path = "examples/effects/01_basic_effects.rs"
required-features = ["std"]

[[example]]
name = "effects_retry_repeat"
path = "examples/effects/02_retry_and_repeat.rs"
required-features = ["std"]

[[example]]
name = "effects_acquire_release"
path = "examples/effects/03_acquire_release_and_scopes.rs"
required-features = ["std"]

[[example]]
name = "effects_di_mocking"
path = "examples/effects/05_dependency_injection_mocking.rs"
required-features = ["std"]

[[example]]
name = "effects_supervision"
path = "examples/effects/06_concurrency_and_supervision.rs"
required-features = ["std"]

[[example]]
name = "embed_standalone_vm"
path = "examples/embedding/standalone_vm.rs"
required-features = ["std"]

[dependencies]
dynasmrt = { version = "5.1.0", optional = true }
serde = { version = "1.0.229", default-features = false, features = [
  "derive",
  "alloc",
] }
thiserror = { version = "2.0.20", default-features = false }
toml = { version = "1.1.6", optional = true }
libloading = { version = "0.9.0", optional = true }
dirs = { version = "7.0.0", optional = true }
hashbrown = { version = "0.17.1", default-features = false, features = [
  "default-hasher",
  "equivalent",
] }
foldhash = { version = "0.2.0", default-features = false }
libm = { version = "0.2.16", default-features = false }
lust-macros = { path = "crates/lust-macros", version = "0.1.3", optional = true }
regex = { version = "1.13.1", optional = true }
regex-automata = { version = "0.4.18", default-features = false, features = ["std", "dfa-onepass", "dfa-search", "syntax", "hybrid"], optional = true }
rand = { version = "0.10.2", optional = true }
serde_json = { version = "1.0.151", optional = true, features = ["std"] }
object = { version = "0.40.0", default-features = false, features = [
  "std",
  "read_core",
  "read",
], optional = true }
full_moon = { version = "2.2.0", optional = true }
cranelift-codegen = { version = "0.137.1", optional = true }
cranelift-frontend = { version = "0.137.1", optional = true }
cranelift-jit = { version = "0.137.1", optional = true }
cranelift-module = { version = "0.137.1", optional = true }
cranelift-native = { version = "0.137.1", optional = true }
log = { version = "0.4", optional = true }
tempfile = { version = "3.27.0", optional = true }
mimalloc = { version = "0.1.52", default-features = false, optional = true }
tokio = { version = "1.53.1", optional = true, features = ["net", "io-util", "rt", "rt-multi-thread", "sync", "time", "macros"] }
hyper = { version = "1.12.0", optional = true, features = ["http1", "client", "server"] }
hyper-util = { version = "0.1.21", optional = true, features = ["tokio", "http1", "client-legacy", "server"] }
http-body-util = { version = "0.1.5", optional = true }
bytes = { version = "1.12.1", optional = true }
rusqlite = { version = "0.33.0", optional = true }

[build-dependencies]

[dev-dependencies]
tempfile = "3.27.0"
tree-sitter = "0.20.10"
tree-sitter-lust = { path = "tree-sitter-lust" }

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
wasm-bindgen = "0.2.128"
console_error_panic_hook = "0.1.7"
web-sys = { version = "0.3.105", features = ["console"] }
getrandom = { version = "0.4.3", features = ["wasm_js"] }

[target.'cfg(target_os = "wasi")'.dependencies]
getrandom = { version = "0.4.3" }

[profile.release]
strip = false
lto = "fat"
opt-level = 3
debug = 1
overflow-checks = false
panic = "abort"
codegen-units = 1

[profile.nostd_32]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"

[lints.clippy]
approx_constant = "allow"

[lints.cargo]
unused_dependencies = "warn"

