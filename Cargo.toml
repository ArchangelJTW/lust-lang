[workspace]
members = [".", "crates/lust-analyzer", "crates/lust-macros"]
exclude = ["examples/rust-extension/extensions/**", "tree-sitter-lust"]

[package]
name = "lust-rs"
version = "3.5.4"
edition = "2024"
include = [
  "/src/**",
  "/include/**",
  "/examples/embed.rs",
  "/benchmarks/numeric.rs",
  "/build.rs",
  "/Cargo.toml",
  "/README.md",
  "/LICENSE",
  "/LICENSE-MIT",
  "/LICENSE-APACHE",
]
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = [
  "scripting",
  "scripting-language",
  "scripting-engine",
  "embedded",
  "lust",
]
categories = [
  "parser-implementations",
  "compilers",
  "development-tools",
  "wasm",
]
description = "A WIP Lua-like scripting language implemented in Rust, designed for embedding and rapid scripting with a strong type system, with trace-based JIT."
homepage = "https://lust-lang.dev/"
build = "build.rs"

[lib]
name = "lust"
crate-type = ["rlib", "cdylib"]

[features]
default = ["std", "packages"]
std = [
  "dep:dynasmrt",
  "dep:toml",
  "serde/std",
  "thiserror/std",
  "dep:lust-macros",
  "dep:regex",
  "dep:rand",
]
# JIT for riscv32 targets. Enables `std` because dynasmrt requires it
# (memmap2, std::sync). Requires a std-capable runtime (e.g. Linux/RISC-V).
# Floats require the RV32F extension.
rv32 = ["std", "dep:dynasmrt"]
libloading = ["std", "dep:libloading"]
dirs = ["std", "dep:dirs"]
packages = ["std", "libloading", "dirs", "dep:serde_json", "dep:object"]
lua_transpile = ["std", "dep:full_moon"]
# ESP32 debugging support - adds logging via esp-println
esp32c6-logging = ["dep:esp-println", "dep:log"]

[[bin]]
name = "lust"
path = "src/main.rs"
required-features = ["std"]

[[example]]
name = "numeric"
path = "benchmarks/numeric.rs"
required-features = ["std"]

[dependencies]
dynasmrt = { version = "5.1.0", optional = true }
serde = { version = "1.0.229", default-features = false, features = [
  "derive",
  "alloc",
] }
thiserror = { version = "2.0.20", default-features = false }
toml = { version = "1.1.6", optional = true }
libloading = { version = "0.9.0", optional = true }
dirs = { version = "7.0.0", optional = true }
hashbrown = { version = "0.17.1", default-features = false, features = [
  "default-hasher",
  "equivalent",
] }
libm = { version = "0.2.16", default-features = false }
lust-macros = { path = "crates/lust-macros", version = "0.1.3", optional = true }
regex = { version = "1.13.1", optional = true }
rand = { version = "0.10.2", optional = true }
serde_json = { version = "1.0.151", optional = true, features = ["std"] }
object = { version = "0.40.0", default-features = false, features = [
  "std",
  "read_core",
  "read",
], optional = true }
full_moon = { version = "2.2.0", optional = true }
esp-println = { version = "0.18.0", optional = true, features = [
  "esp32c6",
  "auto",
  "log-04",
] }
log = { version = "0.4", optional = true }

[build-dependencies]
dynasm = "5.1.0"

[dev-dependencies]
tempfile = "3.27.0"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2.128"
console_error_panic_hook = "0.1.7"
web-sys = { version = "0.3.105", features = ["console"] }
getrandom = { version = "0.4.3", features = ["wasm_js"] }

[profile.release]
strip = "symbols"
lto = "fat"
opt-level = 3
debug = 0
overflow-checks = false
panic = "abort"
codegen-units = 1
