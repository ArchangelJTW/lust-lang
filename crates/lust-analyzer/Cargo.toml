[package]
name = "lust-analyzer"
version = "0.7.5"
edition = "2021"
include = ["src/**", "Cargo.toml", "README.md", "LICENSE"]
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["lust", "language-server", "lsp"]
categories = ["development-tools", "development-tools::debugging"]
description = "A WIP implementation of the language server protocol (LSP) for the Lust programming language"
homepage = "https://lust-lang.dev/"

[dependencies]
tokio = { version = "1.53.1", features = [
  "macros",
  "rt-multi-thread",
  "io-std",
] }
tower-lsp = "0.20.0"
url = "2.5.8"
lust = { path = "../..", version = "3.5.6", package = "lust-rs" }
hashbrown = { version = "0.17.1", default-features = false, features = [
  "default-hasher",
  "equivalent",
] }
