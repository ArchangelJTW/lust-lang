[package]
name = "lust-macros"
version = "0.1.4"
edition = "2021"
include = ["src/**", "Cargo.toml", "README.md", "LICENSE"]
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["lust", "macros"]
categories = ["development-tools"]
description = "Procedural macros for the Lust programming language"
homepage = "https://lust-lang.dev/"

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1.0.107"
quote = "1.0.47"
syn = { version = "3.0.5", features = ["full"] }
