[package]
name = "lust-tokio"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Tokio async runtime bridge and worker pool for the Lust scripting language"

[dependencies]
lust = { package = "lust-rs", path = "../..", default-features = false, features = ["std"] }
tokio = { version = "1.53.1", features = ["rt", "sync", "time", "macros"] }
tokio-util = { version = "0.7.19", features = ["rt"] }

[dev-dependencies]
tokio = { version = "1.53.1", features = ["rt", "rt-multi-thread", "sync", "time", "macros"] }
