[package]
name = "lust-wasi-runner"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false
description = "Embedded Wasmtime 50 WASI Preview 1 & Preview 2 test runner helper (used when system wasmtime CLI is absent)"

[[bin]]
name = "lust-wasi-runner"
path = "src/main.rs"

[dependencies]
wasmtime = { version = "50.0.1", default-features = false, features = [
  "cranelift",
  "runtime",
  "std",
  "component-model",
  "async",
  "anyhow",
] }
wasmtime-wasi = { version = "50.0.1", default-features = false, features = ["p1", "p2"] }
